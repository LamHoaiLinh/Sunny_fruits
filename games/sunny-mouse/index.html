<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffe5f1">
<title>Sunny Mouse · Luyện chuột và vẽ</title>
<style>
:root{font-family:"Trebuchet MS",Arial,sans-serif;color:#493747;background:#fff6fb}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#fff1f7,#ecf9ff);min-height:100dvh}
header{max-width:1150px;margin:auto;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
a{color:#9b3f70;font-weight:800}h1{margin:0;color:#dd5094;font-size:clamp(23px,4vw,35px)}
small{color:#765e70}main{max-width:1150px;margin:auto;padding:0 12px 35px}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
button{font:inherit;font-weight:800;border:2px solid #f9cce0;background:#fff;border-radius:16px;padding:10px 13px;cursor:pointer;color:#874365;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid #3599d9;outline-offset:2px}
button.active,.primary{background:#ee79ac;color:white;border-color:#ee79ac}
button[disabled]{opacity:.5;cursor:default}
.panel{background:white;border-radius:22px;box-shadow:0 10px 28px #ba83a320;padding:12px;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:8px}
.toolbar .group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
#instruction{font-weight:800;font-size:clamp(17px,2.6vw,25px);margin:7px 0 10px}
#surface{height:clamp(330px,58vh,540px);border-radius:17px;position:relative;overflow:hidden;isolation:isolate;border:2px solid #ffdeed;background:linear-gradient(140deg,#ecf9ff,#fff7df);touch-action:none;user-select:none;-webkit-user-select:none}
#surface .item{position:absolute;user-select:none;-webkit-user-drag:none}
#feedback{min-height:26px;font-weight:900;color:#267950;margin-top:8px}
#guide{font-size:13px;line-height:1.5;color:#695063}
#win{display:none;position:absolute;inset:0;z-index:30;place-items:center;background:#fff8;backdrop-filter:blur(4px);padding:12px}
#win.show{display:grid}
.win-card{max-width:400px;width:100%;text-align:center;background:white;border:3px solid #ffe3ef;border-radius:25px;padding:24px;box-shadow:0 15px 35px #7b3e6e35}
.win-card h2{margin:8px 0;color:#db5391}.win-card .star{font-size:58px}
#animalWord{font-size:20px;font-weight:900}
.fish{position:absolute;background-repeat:no-repeat;background-size:200% 100%;cursor:pointer;touch-action:none;filter:drop-shadow(1px 3px 3px #20427040)}
.star-target{position:absolute;width:clamp(58px,9vw,88px);height:clamp(58px,9vw,88px);object-fit:contain;pointer-events:none}
.duck{width:clamp(65px,11vw,95px);height:clamp(65px,11vw,95px);position:absolute;pointer-events:none;filter:drop-shadow(0 8px 7px #2223)}
.tile{position:absolute;border:1px solid #fff8;border-radius:7px;padding:0;background-position:center;background-size:100% 100%;touch-action:none;cursor:pointer}
.animal-row{height:100%;display:flex;justify-content:center;align-items:center;gap:12px;padding:30px 12px;position:relative}
.animal{width:30%;max-width:250px;border:5px solid #fff;background:#fffbfd;border-radius:15px;box-shadow:0 6px 18px #0002;text-align:center;overflow:hidden}
.animal img{width:100%;height:clamp(100px,24vh,195px);object-fit:cover;display:block}
.animal span{display:block;padding:7px 0;font-weight:900}
#drawLayer{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;z-index:3}
.dot{cursor:pointer}
#dataInfo{font-size:12px;color:#806778;margin-top:8px}
@media(max-width:650px){header{padding:10px}main{padding:0 6px 15px}.modes{gap:5px}.modes button{flex:1 1 28%;font-size:12px;padding:9px 5px}#surface{height:min(55vh,475px);min-height:340px}.panel{padding:8px}.toolbar{gap:5px}.toolbar button{padding:7px 9px}.animal-row{gap:4px;padding:20px 5px}.animal{width:32%;border-width:2px}.animal span{font-size:11px}.animal img{height:130px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header><a href="../../index.html" aria-label="Trở về Sunny Game Hub">← SUNNY HUB</a><h1>🐭 SUNNY MOUSE</h1><small>Chơi và luyện tập • Tiếng Việt</small></header>
<main>
<nav class="modes" id="modes" aria-label="Chọn bài tập">
<button data-mode="move">1. Rê chuột</button><button data-mode="fish">2. Bắt cá</button>
<button data-mode="erase">3. Khám phá</button><button data-mode="dots">4. Nối điểm</button>
<button data-mode="circle">5. Khoanh tròn</button>
</nav>
<section class="panel">
<div class="toolbar">
<div class="group"><button id="prev" aria-label="Màn trước">◀</button><strong id="levelText">Màn 1 / 6</strong><button id="next" aria-label="Màn sau">▶</button><button id="restart">↻ Chơi lại</button></div>
<div class="group"><button id="sound" aria-pressed="true">🔊 Âm thanh</button><button id="repeat">▶ Nghe hướng dẫn</button></div>
</div>
<div id="instruction" aria-live="polite">Chọn bài tập để bắt đầu</div>
<div id="surface" aria-label="Khu vực chơi">
<div id="win" role="status"><div class="win-card"><div class="star">🌟</div><h2>Sunny giỏi quá!</h2><p>Con đã hoàn thành màn chơi.</p><button id="continue" class="primary">Màn tiếp theo →</button></div></div>
</div>
<div id="feedback" aria-live="polite"></div>
<div id="guide">Máy tính: dùng chuột thật. Điện thoại: chạm và kéo bằng ngón tay. Tiến độ lưu trên từng thiết bị.</div>
<div id="dataInfo"></div>
</section>
</main>
<script src="https://raw.githubusercontent.com/gcompris/GCompris-qt/e261a949a9965f14d3c642b2698b43042f338357/src/activities/clickanddraw/clickanddraw_dataset.js"></script>
<script>
/* Sunny Mouse: web interaction adapter. Original GCompris assets/code are not modified.
 * Source and licenses: https://github.com/gcompris/GCompris-qt

 */
(()=>{
"use strict";
const REV="e261a949a9965f14d3c642b2698b43042f338357";
const ROOT="https://raw.githubusercontent.com/gcompris/GCompris-qt/"+REV+"/src/";
const A=(activity,file)=>ROOT+"activities/"+activity+"/resource/"+file;
const S=(file)=>ROOT+"core/resource/sounds/"+file;
const C=(file)=>ROOT+"core/resource/"+file;
const $=id=>document.getElementById(id);
const area=$("surface"),feedback=$("feedback"),instruction=$("instruction");
const storageKey="sunny_mouse_v1";
let state={};try{state=JSON.parse(localStorage.getItem(storageKey)||"{}")||{}}catch(_){}
let mode="move",level=1,clean=[],raf=0,won=false,muted=false,miss=0;
const desc={
 move:"Rê con trỏ tới các ngôi sao sáng. Trên điện thoại, kéo ngón tay.",
 fish:"Nhấp vào từng chú cá đang bơi. Trên điện thoại, chạm vào cá.",
 erase:"Di chuyển chuột qua các ô màu để khám phá bức ảnh. Trên điện thoại, vuốt ngón tay.",
 dots:"Nhấp lần lượt vào các chấm theo số thứ tự.",
 circle:"Nghe tên con vật rồi giữ chuột trái và khoanh quanh đúng hình. Điện thoại: vẽ bằng ngón tay."
};
function save(){state[mode]={level};try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(_){}}
function on(el,type,fn,opts){el.addEventListener(type,fn,opts);clean.push(()=>el.removeEventListener(type,fn,opts))}
function clear(){clean.forEach(f=>f());clean=[];cancelAnimationFrame(raf);raf=0;won=false;miss=0;area.querySelectorAll(":scope > :not(#win)").forEach(x=>x.remove());$("win").classList.remove("show");feedback.textContent=""}
function audio(file){if(muted)return;try{const a=new Audio(S(file));a.volume=.4;a.play().catch(()=>{})}catch(_){}}
function speak(text,lang="vi-VN"){if(muted||!("speechSynthesis"in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.8;speechSynthesis.speak(u)}catch(_){}}
function message(t){feedback.textContent=t}
function complete(){if(won)return;won=true;audio("win.wav");$("win").classList.add("show");$("continue").textContent=level===6?"Chơi lại từ màn 1 →":"Màn tiếp theo →"}
function setup(m,l){clear();mode=m;level=Math.max(1,Math.min(6,l));save();$("levelText").textContent="Màn "+level+" / 6";instruction.textContent=desc[mode];document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));message("");({move:startMove,fish:startFish,erase:startErase,dots:startDots,circle:startCircle})[mode]()}
const spots=[[.2,.25],[.74,.7],[.76,.21],[.26,.73],[.49,.5],[.13,.52],[.86,.48],[.49,.16],[.5,.82]];
function startMove(){
 area.style.background="linear-gradient(140deg,#e9faff,#fef2db)";
 const duck=document.createElement("img");duck.className="duck";duck.src=A("colors","blue_duck.svg");duck.alt="Chú vịt xanh";area.append(duck);
 const num=Math.min(2+level,8),left=new Set();
 for(let i=0;i<num;i++){const star=document.createElement("img");star.className="star-target";star.src=C("bonus/star_good.svg");star.alt="Ngôi sao";star.style.left="calc("+(spots[i][0]*100)+"% - 35px)";star.style.top="calc("+(spots[i][1]*100)+"% - 35px)";star.dataset.i=i;area.append(star);left.add(i)}
 function move(e){if(won)return;if(e.pointerType==="touch"&&e.type==="pointermove"&&e.buttons===0)return;
 const b=area.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
 duck.style.left=(x-duck.offsetWidth/2)+"px";duck.style.top=(y-duck.offsetHeight/2)+"px";
 for(let i of [...left]){const p=spots[i],dx=x-p[0]*b.width,dy=y-p[1]*b.height;if(Math.hypot(dx,dy)<45){left.delete(i);const el=area.querySelector('[data-i="'+i+'"]');el?.remove();audio("bleep.wav");message("Đã chạm "+(num-left.size)+"/"+num+" ngôi sao!");}}
 if(!left.size)complete()
 }
 on(area,"pointermove",move);on(area,"pointerdown",move);
 speak("Di chuyển chuột tới từng ngôi sao nhé!");
}
function startFish(){
 const cfg=[5,7,10,12,15,18],n=cfg[level-1],names=["f01.webp","f02.webp","f03.webp","f04.webp","f05.webp","f06.webp","f07.webp","f08.webp","f09.webp","f10.webp","f11.webp","f12.webp","cichlid1.webp","discus2.webp","blueking2.webp"];
 area.style.background="center / cover no-repeat url('"+A("clickgame","sea"+level+".webp")+"'), #c9eeff";
 let alive=n,fish=[],last=0;message("Bắt "+n+" con cá!");
 const b=area.getBoundingClientRect();
 for(let i=0;i<n;i++){let el=document.createElement("div");el.className="fish";const w=Math.max(56,Math.min(102,116-level*7)),h=w*.65;el.style.width=w+"px";el.style.height=h+"px";el.style.backgroundImage="url('"+A("clickgame",names[(i*3+level)%names.length])+"')";
 const f={el,x:Math.random()*Math.max(1,b.width-w),y:20+Math.random()*Math.max(1,b.height-h-45),vx:(.035+level*.01+Math.random()*.045)*(Math.random()<.5?-1:1),vy:(Math.random()-.5)*.05,w,h,frame:i%2};
 el.style.backgroundPosition=f.frame?"100% 0":"0 0";el.style.transform="translate("+f.x+"px,"+f.y+"px)";
 on(el,"pointerdown",e=>{if(won)return;e.preventDefault();if(!f.el.isConnected)return;f.el.remove();alive--;audio("drip.wav");message("Còn "+alive+" con cá");if(alive===0)complete()});
 area.append(el);fish.push(f)}
 function tick(t){if(won)return;const dt=Math.min(45,t-last||16);last=t;const r=area.getBoundingClientRect();
 for(const f of fish){if(!f.el.isConnected)continue;f.x+=f.vx*dt;f.y+=f.vy*dt;
 if(f.x<0||f.x>r.width-f.w){f.vx*=-1;f.x=Math.min(Math.max(f.x,0),Math.max(0,r.width-f.w))}
 if(f.y<10||f.y>r.height-f.h){f.vy*=-1;f.y=Math.min(Math.max(f.y,10),Math.max(10,r.height-f.h))}
 f.el.style.transform="translate("+f.x+"px,"+f.y+"px) scaleX("+(f.vx<0?-1:1)+")";}raf=requestAnimationFrame(tick)}
 raf=requestAnimationFrame(tick);
 speak("Nhấp chuột vào các chú cá!");
}
function startErase(){
 const names=["kitten.webp","butterfly.webp","penguin.webp","giraffe.webp","dolphin.webp","red_panda.webp"];
 area.style.background="center / cover no-repeat url('"+A("erase",names[level-1])+"'), #f0e8de";
 const cols=level<3?5:level<5?7:9,rows=level<3?4:level<5?6:7;
 let left=cols*rows;
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
 const el=document.createElement("button");el.type="button";el.className="tile";
 el.style.left=(x*100/cols)+"%";el.style.top=(y*100/rows)+"%";
 el.style.width=(100/cols+.3)+"%";el.style.height=(100/rows+.3)+"%";
 el.style.backgroundImage="url('"+A("erase","transparent_square"+(level%3===0?"_yellow":level%3===1?"":"_green")+".svg")+"')";
 el.setAttribute("aria-label","Gỡ ô che ảnh");
 function hit(){if(!el.isConnected||won)return;el.remove();left--;if(left%4===0)audio("smudge.wav");if(!left)complete()}
 on(el,"pointerdown",e=>{e.preventDefault();hit()});
 on(el,"pointerenter",e=>{if(e.pointerType==="mouse"||e.buttons)hit()});area.append(el)
 }
 on(area,"pointermove",e=>{if(e.pointerType==="touch"&&e.buttons===0)return;const hit=document.elementFromPoint(e.clientX,e.clientY);if(hit&&hit.classList.contains("tile"))hit.dispatchEvent(new PointerEvent("pointerenter",{pointerType:e.pointerType,buttons:e.buttons}))});
 speak("Rê chuột để khám phá bức tranh!");
}
function startDots(){
 area.style.background="#fdf8ed";
 const data=(typeof window.get==="function"?window.get():[]),items=data.length?data:[
 {imageName1:"dn_fond1.svg",coordinates:[[267,121],[349,369],[139,216],[397,214],[190,369],[267,121]]},
 {imageName1:"house1.svg",coordinates:[[306,360],[412,360],[413,175],[356,120],[272,40],[119,177],[120,361],[253,361],[306,360]]}];
 const shape=items[Math.min(level-1,items.length-1)],pts=shape.coordinates.slice();
 const limit=[6,8,10,15,22,32][level-1],count=Math.min(pts.length,limit);
 // The original SVG artwork and the original point data are loaded without modification.
 const NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");
 svg.setAttribute("viewBox","0 0 520 550");svg.setAttribute("preserveAspectRatio","xMidYMid meet");svg.style.cssText="width:100%;height:100%;display:block;background:#fffefa";area.append(svg);
 const bg=document.createElementNS(NS,"image");bg.setAttribute("href",A("number_sequence",shape.imageName1));bg.setAttribute("width","520");bg.setAttribute("height","550");bg.setAttribute("opacity",".54");svg.append(bg);
 let idx=0,prev=null;
 for(let i=0;i<count;i++){const [x,y]=pts[i];const g=document.createElementNS(NS,"g");const c=document.createElementNS(NS,"circle");c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",level<4?"16":"12");c.setAttribute("fill","#f9d4e5");c.setAttribute("stroke","#aa5790");c.setAttribute("stroke-width","3");c.classList.add("dot");const txt=document.createElementNS(NS,"text");txt.setAttribute("x",x);txt.setAttribute("y",y+5);txt.setAttribute("fill","#643756");txt.setAttribute("font-size","17");txt.setAttribute("font-weight","bold");txt.setAttribute("text-anchor","middle");txt.style.pointerEvents="none";txt.textContent=i+1;
 g.append(c,txt);svg.append(g);on(g,"pointerdown",e=>{e.preventDefault();if(won||i!==idx){if(!won)message("Hãy chọn số "+(idx+1));return}c.setAttribute("fill","#83d9a1");if(prev){const line=document.createElementNS(NS,"line");line.setAttribute("x1",prev[0]);line.setAttribute("y1",prev[1]);line.setAttribute("x2",x);line.setAttribute("y2",y);line.setAttribute("stroke","#69ade0");line.setAttribute("stroke-width","7");line.setAttribute("stroke-linecap","round");svg.insertBefore(line,bg.nextSibling)}prev=[x,y];idx++;audio("audioclick.wav");message("Đã nối "+idx+"/"+count+" điểm");if(idx===count)complete()})}
 speak("Nhấp vào các chấm theo thứ tự một, hai, ba!");
}
function startCircle(){
 area.style.background="linear-gradient(135deg,#fff4df,#f0faff)";
 const animals=[["kitten.webp","con mèo","cat"],["horse.webp","con ngựa","horse"],["bee.webp","con ong","bee"],["butterfly.webp","con bướm","butterfly"],["dolphin.webp","cá heo","dolphin"],["penguin.webp","chim cánh cụt","penguin"]];
 const target=(level-1)%animals.length,order=[target,(target+1)%animals.length,(target+2)%animals.length].sort((a,b)=>(a*5+level)%7-(b*5+level)%7);
 const row=document.createElement("div");row.className="animal-row";area.append(row);
 let correct;
 for(let i of order){const item=document.createElement("div");item.className="animal";const img=document.createElement("img");img.src=A("erase",animals[i][0]);img.alt=animals[i][1];const label=document.createElement("span");label.textContent=animals[i][1];item.append(img,label);row.append(item);if(i===target)correct=item}
 const cv=document.createElement("canvas");cv.id="drawLayer";area.append(cv);
 const ctx=cv.getContext("2d");let path=[],drawing=false;
 function resize(){const r=area.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}
 resize();on(window,"resize",resize);
 const pt=e=>{const r=area.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
 function paint(color="#3289dc"){ctx.clearRect(0,0,cv.width,cv.height);if(path.length<2)return;ctx.beginPath();ctx.moveTo(...path[0]);for(let i=1;i<path.length;i++)ctx.lineTo(...path[i]);ctx.strokeStyle=color;ctx.lineWidth=7;ctx.lineJoin="round";ctx.lineCap="round";ctx.stroke()}
 function contains(p,poly){let yes=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])yes=!yes}return yes}
 function check(){
 if(path.length<14)return false;
 const r=area.getBoundingClientRect(),b=correct.getBoundingClientRect(),cx=b.left-r.left+b.width/2,cy=b.top-r.top+b.height/2;
 const points=[[cx,cy],[cx-b.width*.23,cy],[cx+b.width*.23,cy],[cx,cy-b.height*.23],[cx,cy+b.height*.23]];
 const close=Math.hypot(path[0][0]-path[path.length-1][0],path[0][1]-path[path.length-1][1])<Math.max(75,b.width*.55);
 const right=points.every(p=>contains(p,path));
 const others=[...row.children].filter(el=>el!==correct).some(el=>{const o=el.getBoundingClientRect();return contains([o.left-r.left+o.width/2,o.top-r.top+o.height/2],path)});
 return close&&right&&!others
 }
 on(cv,"pointerdown",e=>{e.preventDefault();if(won)return;drawing=true;path=[pt(e)];cv.setPointerCapture(e.pointerId);paint()});
 on(cv,"pointermove",e=>{if(!drawing||won)return;path.push(pt(e));paint()});
 function end(e){if(!drawing||won)return;drawing=false;path.push(pt(e));if(check()){paint("#3bb981");message("Khoanh đúng rồi!");complete()}else{miss++;paint("#e66b7d");message("Thử lại nhé! Hãy đi quanh hình và nối đầu với cuối.");setTimeout(()=>{if(!won){path=[];ctx.clearRect(0,0,cv.width,cv.height)}},900)}}
 on(cv,"pointerup",end);on(cv,"pointercancel",()=>{drawing=false;path=[];ctx.clearRect(0,0,cv.width,cv.height)});
 const intro="Hãy khoanh tròn "+animals[target][1]+".";
 instruction.textContent=intro+" Giữ chuột trái khi vẽ.";speak("Find the "+animals[target][2],"en-US");
 $("repeat").onclick=()=>speak("Find the "+animals[target][2],"en-US");
}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{ $("repeat").onclick=defaultSpeak;setup(b.dataset.mode,state[b.dataset.mode]?.level||1)}));
$("prev").onclick=()=>setup(mode,level-1);
$("next").onclick=()=>setup(mode,level+1);
$("restart").onclick=()=>setup(mode,level);
$("continue").onclick=()=>setup(mode,level===6?1:level+1);
$("sound").onclick=()=>{muted=!muted;$("sound").textContent=muted?"🔇 Tắt tiếng":"🔊 Âm thanh";$("sound").setAttribute("aria-pressed",String(!muted));if(muted&&"speechSynthesis"in window)speechSynthesis.cancel()};
function defaultSpeak(){speak(desc[mode])}
$("repeat").onclick=defaultSpeak;
const oldSetup=setup;
setup("move",state.move?.level||1);
})();
</script>
</body>
</html>
