<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#ffd6e7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sunny Fruits</title>
  <link rel="icon" href="../../assets/icons/sunny-fruits.svg">
  <link rel="stylesheet" href="../../css/style.css?v=20260918-2032">
</head>
<body><a href="../../index.html" style="position:fixed;left:12px;top:12px;z-index:9999;text-decoration:none;background:#fff;border:2px solid #ffd0df;border-radius:14px;padding:7px 10px;font-weight:800;color:#b84f78;box-shadow:0 4px 12px #0001">🏠 HUB</a>
<div id="app" aria-label="Sunny Fruits">
  <section id="splash" class="screen active">
    <div class="sky-deco">☁️ ✨ ☁️</div>
    <div class="logo-card">
      <div class="logo-fruits">🍓 🍊 🍇</div>
      <h1>SUNNY FRUITS</h1>
      <p>Xếp trái cây thật vui!</p>
      <button id="btnStart" class="primary big">Chơi ngay</button>
      <button id="btnTutorial" class="soft">Hướng dẫn</button>
    </div>
  </section>

  <section id="game" class="screen">
    <header class="hud">
      <div class="brand"><b>SUNNY FRUITS</b><span id="levelLabel">Cấp 1</span></div>
      <div class="progress"><span id="winDots">○ ○ ○</span><small id="seedLabel"></small></div>
      <div class="hud-actions">
        <button id="btnHint" title="Gợi ý">💡<span>Gợi ý</span></button>
        <button id="btnUndo" title="Đi lại">↶<span>Đi lại</span></button>
        <button id="btnRestart" title="Chơi lại câu đố hiện tại">↻<span>Làm lại</span></button>
        <button id="btnShuffle" title="Đổi sang câu đố khác cùng Cấp">🔀<span>Đổi màn</span></button>
        <button id="btnResetLevel" class="danger-action" title="Chơi lại từ Cấp 1">↩️<span>Cấp 1</span></button>
        <button id="btnSound" title="Âm thanh">🔊<span>Âm thanh</span></button>
      </div>
    </header>
    <div class="stats"><span id="moveLabel">Số bước: 0</span><span id="message" role="status"></span></div>
    <main id="boardWrap">
      <div id="rotateOverlay" class="rotate-overlay hidden">
        <div class="rotate-icon">📱↻</div>
        <b>Xoay ngang màn hình sẽ chơi dễ hơn</b>
        <small>Hoặc tiếp tục chơi dọc với màn hiện tại.</small>
        <button id="btnPlayPortrait" type="button" class="primary rotate-continue" onclick="document.getElementById('rotateOverlay').classList.add('hidden');try{localStorage.setItem('sunny_fruits_allow_portrait_v1','1')}catch(e){};setTimeout(function(){if(window.SunnyRenderer)SunnyRenderer.fitBoard()},50)">▶ Chơi dọc</button>
      </div>
      <div id="board" class="board" aria-label="Bàn xếp trái cây">
        <div id="leftReserve" class="reserve left" data-pos="reserve-left" aria-label="Ô để tạm 1"><span class="reserve-label">Để tạm 1</span></div>
        <div id="rightReserve" class="reserve right" data-pos="reserve-right" aria-label="Ô để tạm 2"><span class="reserve-label">Để tạm 2</span></div>
        <div id="rail" class="rail"></div>
        <div id="columns" class="columns"></div>
        <div id="dragLayer" class="drag-layer"></div>
      </div>
    </main>
    <footer class="tip">Nhấp 1 lần để chọn rồi nhấp nơi đến • Hoặc kéo thả • Cột có 4 trái sẽ chặn đường</footer>
  </section>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div id="modalIcon" class="modal-icon">🌟</div>
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <div id="modalActions" class="modal-actions"></div>
    </div>
  </div>

  <div id="tutorial" class="tutorial hidden">
    <div class="tutorial-card">
      <div id="tutorialVisual" class="tutorial-visual">🍓 → 🍓🍓🍓</div>
      <h2 id="tutorialTitle">Cách chơi</h2>
      <p id="tutorialText"></p>
      <div class="tutorial-nav">
        <button id="tutorialSkip" class="soft">Bỏ qua</button>
        <button id="tutorialNext" class="primary">Tiếp theo</button>
      </div>
    </div>
  </div>
</div>
<script src="../../js/sheet_chunks/sheet1_1.js"></script>
<script src="../../js/sheet_chunks/sheet1_2.js"></script>
<script src="../../js/sheet_chunks/sheet1_3.js"></script>
<script src="../../js/sheet_chunks/sheet2_1.js"></script>
<script src="../../js/sheet_chunks/sheet2_2.js"></script>
<script src="../../js/sheet_chunks/sheet2_3.js"></script>
<script src="../../js/sheet_chunks/sheet2_4.js"></script>
<script src="../../js/sheets.js"></script>
<script src="../../js/fruits.js"></script>
<script src="../../js/rules.js?v=20260918-2032"></script>
<script src="../../js/generator.js?v=20260918-2032"></script>
<script src="../../js/solver.js?v=20260918-2032"></script>
<script src="../../js/storage.js?v=20260918-2032"></script>
<script src="../../js/audio.js?v=20260918-2032"></script>
<script src="../../js/renderer.js?v=20260918-2032"></script>
<script src="../../js/tutorial.js?v=20260918-2032"></script>
<script src="../../js/game.js?v=20260918-2032"></script>
</body>
</html>
