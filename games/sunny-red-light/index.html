<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bdeeff">
<title>Sunny Red Light</title>
<link rel="stylesheet" href="style.css?v=20261006-command1">
</head>
<body>
<main id="game" aria-label="Sunny Red Light">
  <canvas id="canvas"></canvas>
  <a class="home" href="../../index.html" aria-label="Về Sunny Game Hub">⌂</a>
  <div class="progress" aria-hidden="true"><div id="progressFill"></div></div>

  <section class="combo-wrap" aria-label="Chuỗi thao tác">
    <div id="combo" class="combo"></div>
  </section>

  <section class="gesture-wrap" aria-label="Vùng điều khiển">
    <div id="gesturePad" class="gesture-pad" role="button" tabindex="0" aria-label="Vuốt hoặc chạm">
      <span class="pad-arrow up">↑</span>
      <span class="pad-arrow right">→</span>
      <span class="pad-arrow down">↓</span>
      <span class="pad-arrow left">←</span>
      <span class="pad-dot">●</span>
    </div>
  </section>

  <div id="startOverlay" class="overlay show">
    <div class="overlay-card intro-card">
      <div class="intro-icons" aria-hidden="true"><span>↑</span><span>↓</span><span>←</span><span>→</span><span>●</span></div>
      <button id="startBtn" class="big-btn" aria-label="Bắt đầu">▶</button>
    </div>
  </div>

  <div id="resultOverlay" class="overlay">
    <div class="overlay-card result-card">
      <div id="resultIcon" class="result-icon" aria-hidden="true">🏁</div>
      <button id="restartBtn" class="big-btn" aria-label="Chơi lại">↻</button>
    </div>
  </div>
</main>
<script src="game.js?v=20261006-command1"></script>
</body>
</html>
