<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bdeeff">
<title>Sunny Red Light</title>
<link rel="stylesheet" href="style.css?v=20261006-command3">
</head>
<body>
<main id="game" aria-label="Sunny Red Light">
  <canvas id="canvas"></canvas>
  <a class="home" href="../../index.html" aria-label="Về Sunny Game Hub">⌂</a>
  <div class="progress" aria-hidden="true"><div id="progressFill"></div></div>

  <section class="combo-wrap" aria-label="Chuỗi thao tác">
    <div id="combo" class="combo"></div>
  </section>

  <section class="gesture-wrap" aria-label="Vùng điều khiển">
    <div id="gesturePad" class="gesture-pad" role="button" tabindex="0" aria-label="Vuốt hoặc chạm">
      <span class="pad-arrow up">↑</span>
      <span class="pad-arrow right">→</span>
      <span class="pad-arrow down">↓</span>
      <span class="pad-arrow left">←</span>
      <span class="pad-dot">●</span>
    </div>
  </section>

  <div id="lobbyOverlay" class="overlay net-overlay show">
    <div class="overlay-card lobby-card">
      <div class="net-head"><span class="net-title">👧 🔴🟢</span><span id="netStatus" class="net-status">●</span></div>
      <div class="name-row">
        <span class="name-label">👤</span>
        <strong id="selectedName" class="selected-name">?</strong>
      </div>
      <div id="nameButtons" class="name-buttons"></div>
      <div class="lobby-actions">
        <button id="createRoomBtn" class="round-action create" aria-label="Tạo phòng">＋</button>
        <button id="refreshRoomsBtn" class="round-action" aria-label="Làm mới phòng">↻</button>
      </div>
      <div id="roomsList" class="rooms-list" aria-label="Danh sách phòng"></div>
    </div>
  </div>

  <div id="roomOverlay" class="overlay net-overlay">
    <div class="overlay-card room-panel">
      <div class="net-head">
        <button id="roomLeaveBtn" class="mini-action" aria-label="Rời phòng">←</button>
        <strong id="roomTitle" class="room-title">Phòng</strong>
        <span id="roomHint" class="room-hint">•••</span>
      </div>
      <div id="roomPlayers" class="room-players"></div>
      <button id="roomStartBtn" class="big-btn room-start" aria-label="Bắt đầu">▶</button>
    </div>
  </div>

  <div id="countdownOverlay" class="overlay countdown-overlay">
    <div id="countdownValue" class="countdown-value">3</div>
  </div>

  <div id="resultOverlay" class="overlay">
    <div class="overlay-card result-card">
      <div id="resultIcon" class="result-icon" aria-hidden="true">🏁</div>
      <button id="restartBtn" class="big-btn" aria-label="Về phòng">↻</button>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="multiplayer.js?v=20261006-command3"></script>
<script src="game.js?v=20261006-command3"></script>
</body>
</html>
