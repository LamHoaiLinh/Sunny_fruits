<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bdeeff">
<title>Sunny Red Light</title>
<link rel="stylesheet" href="style.css?v=20261006-taprescue1">
</head>
<body>
<main id="game" aria-label="Sunny Red Light">
  <canvas id="canvas"></canvas>
  <a class="home" href="../../index.html" aria-label="Về Sunny Game Hub">⌂</a>
  <div class="progress" aria-hidden="true"><div id="progressFill"></div></div>

  <div id="spectatorBadge" class="spectator-badge">👀</div>
  <button id="rescueBtn" class="rescue-btn" aria-label="Cứu bạn">❤️</button>

  <section id="laneControls" class="lane-controls" aria-label="Chọn làn">
    <button class="lane-btn" data-lane="0" aria-label="Làn trái">◀</button>
    <button class="lane-btn selected" data-lane="1" aria-label="Làn giữa">●</button>
    <button class="lane-btn" data-lane="2" aria-label="Làn phải">▶</button>
  </section>

  <section class="combo-wrap" aria-label="Chuỗi thao tác">
    <div id="combo" class="combo"></div>
  </section>

  <section class="gesture-wrap" aria-label="Nút thao tác">
    <div id="gesturePad" class="gesture-pad" aria-label="Bấm nút theo chuỗi">
      <button class="pad-key up" data-input="up" aria-label="Lên">↑</button>
      <button class="pad-key right" data-input="right" aria-label="Phải">→</button>
      <button class="pad-key down" data-input="down" aria-label="Xuống">↓</button>
      <button class="pad-key left" data-input="left" aria-label="Trái">←</button>
      <button class="pad-key tap" data-input="tap" aria-label="Chạm">●</button>
    </div>
  </section>

  <div id="lobbyOverlay" class="overlay net-overlay show">
    <div class="overlay-card lobby-card">
      <div class="net-head"><span class="net-title">👧 🔴🟢</span><span id="netStatus" class="net-status">●</span></div>
      <div class="name-row">
        <span class="name-label">👤</span>
        <strong id="selectedName" class="selected-name">?</strong>
      </div>
      <div id="nameButtons" class="name-buttons"></div>
      <div class="lobby-actions">
        <button id="createRoomBtn" class="round-action create" aria-label="Tạo phòng">＋</button>
        <button id="refreshRoomsBtn" class="round-action" aria-label="Làm mới phòng">↻</button>
      </div>
      <div id="roomsList" class="rooms-list" aria-label="Danh sách phòng"></div>
    </div>
  </div>

  <div id="roomOverlay" class="overlay net-overlay">
    <div class="overlay-card room-panel">
      <div class="net-head">
        <button id="roomLeaveBtn" class="mini-action" aria-label="Rời phòng">←</button>
        <strong id="roomTitle" class="room-title">Phòng</strong>
        <span id="roomHint" class="room-hint">BO3</span>
      </div>
      <div id="roomScore" class="room-score">☆ ☆ ☆</div>
      <div id="roomPlayers" class="room-players"></div>
      <button id="roomStartBtn" class="big-btn room-start" aria-label="Bắt đầu">▶</button>
    </div>
  </div>

  <div id="countdownOverlay" class="overlay countdown-overlay">
    <div id="countdownValue" class="countdown-value">3</div>
  </div>

  <div id="resultOverlay" class="overlay">
    <div class="overlay-card result-card">
      <div id="resultIcon" class="result-icon" aria-hidden="true">🏁</div>
      <div id="resultText" class="result-text"></div>
      <div id="resultScore" class="result-score"></div>
      <button id="restartBtn" class="big-btn" aria-label="Tiếp tục">▶</button>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="multiplayer.js?v=20261006-lobbyfix1"></script>
<script src="game.js?v=20261006-taprescue1"></script>
</body>
</html>
