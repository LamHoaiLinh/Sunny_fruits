name: Fix Sunny Princess ponytail alignment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-sunny-princess-hair19.yml"

permissions:
  contents: write

jobs:
  fix-hair19:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Re-align hair 19
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          p=Path('games/sunny-princess/assets/layers/hair_19.png')
          im=Image.open(p).convert('RGBA')
          bbox=im.getbbox()
          if not bbox:
              raise SystemExit('hair_19.png has no visible pixels')

          content=im.crop(bbox)
          ratio=55.0/57.6
          nw=round(content.width*ratio)
          nh=round(content.height*ratio)
          content=content.resize((nw,nh),Image.Resampling.LANCZOS)

          canvas=Image.new('RGBA',(960,1440),(0,0,0,0))
          x=(960-nw)//2
          y=round(1440*0.02)
          canvas.alpha_composite(content,(x,y))
          canvas.save(p,optimize=True)
          print(f'hair_19 aligned: {nw}x{nh} at x={x}, y={y}')
          PY

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sunny Hub Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm ".github/workflows/fix-sunny-princess-hair19.yml"
          git add games/sunny-princess/assets/layers/hair_19.png
          git commit -m "game4: align yellow ponytail hair"
          git push
